# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cc5a6db0aaacb62a9604019b7e02b338"
name = "cfs-order-status-panel"
application_url = "https://cfs-order-status-panel.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [ "orders/create", "orders/updated", "orders/cancelled", "refunds/create" ]

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,write_order_edits,read_products,write_app_proxy,read_files,write_files"

[metaobjects.app.cfs_status_history]
name = "CFS status entry"
description = "One history entry per CFS order status change"
display_name_field = "entry_id"
access.admin = "merchant_read"
access.storefront = "none"

[metaobjects.app.cfs_status_history.fields.order_id]
name = "Order ID"
type = "single_line_text_field"
required = true
capabilities.admin_filterable = true

[metaobjects.app.cfs_status_history.fields.entry_id]
name = "Entry ID"
type = "single_line_text_field"
required = true

[metaobjects.app.cfs_status_history.fields.at]
name = "Saved at"
type = "date_time"

[metaobjects.app.cfs_status_history.fields.actor_name]
name = "Actor name"
type = "single_line_text_field"

[metaobjects.app.cfs_status_history.fields.payload]
name = "Entry JSON"
type = "json"

# The customer's delivery confirmation page on the store's website: https://<store>/apps/cfs-delivery/delivery-confirm?t=...
# (not apps/cfs: the cfs-configurator app already uses that path)
[app_proxy]
url = "https://cfs-order-status-panel.onrender.com/proxy"
subpath = "cfs-delivery"
prefix = "apps"

[auth]
redirect_urls = [ "https://cfs-order-status-panel.onrender.com/api/auth" ]
